name: Isolated quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://fixture.supabase.co
      VITE_SUPABASE_PROJECT_ID: fixture
      VITE_SUPABASE_PUBLISHABLE_KEY: fixture-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - run: npm ci
      - run: bun test ./tests/*.test.ts
      - run: bun test tests/integration/recommendPreparation/handler.test.ts
      - run: bun test tests/integration/practiceRepeat/handler.test.ts
      - name: Verify coaching and repeat rights with isolated PostgreSQL
        run: |
          pg_bin="$(pg_config --bindir)"
          socket="$(mktemp -d /tmp/practice-XXXXXX)"
          "$pg_bin/initdb" -D "$socket/db" -A trust -U postgres --no-locale > /dev/null
          "$pg_bin/pg_ctl" -D "$socket/db" -l "$socket/server.log" -o "-k $socket -p 55486 -c listen_addresses=''" start
          trap '"$pg_bin/pg_ctl" -D "$socket/db" stop' EXIT
          FIRST_VALUE_PG="$socket" FIRST_VALUE_PG_PORT=55486 bun tests/integration/firstValue/run.ts
      - run: npx tsc -b
      - run: npm run build -- --manifest
      - run: node scripts/check-bundle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-comparison
          path: dist/bundle-report.md
      - name: Install isolated browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" playwright@1.56.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run browser acceptance (real services blocked)
        run: |
          npm run dev -- --host 127.0.0.1 --port 5193 --strictPort > /tmp/fixture-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for n in $(seq 1 60); do curl -fsS http://127.0.0.1:5193/tests/integration/maintenance/ui.html > /dev/null && break; sleep 1; done
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs"
          node tests/integration/maintenance/browser.mjs
          node tests/integration/chatHistory/browser.mjs
          node tests/integration/loading/browser.mjs
          node tests/integration/realtime/browser.mjs
          FIXTURE_URL=http://127.0.0.1:5193 node tests/integration/correctness/chat-browser.mjs
          node tests/integration/playerAnalysis/browser.mjs
          node tests/integration/featFixes/browser.mjs
          node tests/integration/practiceRepeat/browser.mjs
